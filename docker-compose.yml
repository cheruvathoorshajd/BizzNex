services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bizznex
      POSTGRES_PASSWORD: bizznex
      POSTGRES_DB: bizznex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizznex"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://bizznex:bizznex@db:5432/bizznex?schema=public
      # compose is for local trials: development mode accepts this placeholder secret
      # (production refuses it) and serves /docs; set a real secret anywhere else
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:8080
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:3001
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
