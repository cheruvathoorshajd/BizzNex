server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # ── security headers ──
  # The app: no inline or eval'd script. Inline styles stay allowed (React style props, motion).
  # connect-src: the API is a separate origin baked in at build time (VITE_API_URL), so any
  # https origin is allowed, plus localhost for docker compose. Tighten to your API origin if you like.
  # img-src: company logos from the business lookup (Wikimedia Commons).
  # script-src hash: the inline theme script in index.html (recompute if that script changes).
  set $csp "default-src 'self'; script-src 'self' 'sha256-I3u4p1l4Q3Bsl0K2B3RDY+A/zy1ZIA2zuD/giuni0K8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://commons.wikimedia.org https://upload.wikimedia.org; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
  # A location with its own add_header drops these, so each such location repeats them.
  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

  # long-cache hashed assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri =404;
  }

  # the shell must be revalidated, or a deploy leaves browsers on stale asset hashes
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  # standalone design documents (case study, brand pages) carry their own inline script and styles
  location ~ ^/(case-study\.html|brand/) {
    set $csp "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    try_files $uri =404;
  }

  # SPA fallback (served through /index.html above, so it gets no-cache too)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
